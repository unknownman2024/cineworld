name: Cineworld SeatPlan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  cineworld-seatplan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Cineworld scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python cineworld.py

      - name: Show generated files
        if: always()
        run: |
          echo "Generated files:"
          find cineworld_output -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload Cineworld results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cineworld-seatplan
          path: cineworld_output/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit Cineworld data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cineworld_output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Cineworld SeatPlan"
          git push
