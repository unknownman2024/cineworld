name: Cineworld SeatPlan

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  cineworld-seatplan:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==========================================================
      # INSTALL PLAYWRIGHT
      # ==========================================================

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright


      # ==========================================================
      # INSTALL CHROMIUM + SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install Chromium
        shell: bash
        run: |
          python -m playwright install --with-deps chromium


      # ==========================================================
      # RUN SCRAPER
      # ==========================================================

      - name: Run Cineworld scraper
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python cineworld.py


      # ==========================================================
      # SHOW OUTPUT
      # ==========================================================

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Cineworld output"
          echo "========================================"

          if [ -d "cineworld_output" ]; then
            find cineworld_output \
              -type f \
              -maxdepth 3 \
              -print
          else
            echo "cineworld_output directory not found"
          fi


      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload Cineworld results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cineworld-seatplan
          path: cineworld_output/
          if-no-files-found: warn
          retention-days: 7


      # ==========================================================
      # COMMIT DATA
      # ==========================================================

      - name: Commit Cineworld data
        if: success()
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add cineworld_output/


          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi


          git commit \
            -m "Update Cineworld SeatPlan"


          git push
