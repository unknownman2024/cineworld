name: Event Cinemas AU Scraper (Anti-Detect)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-cinemas-scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Event Cinemas scraper
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # cloudscraper-enhanced bundles:
          #   - Cloudflare v2/v3 challenge solving
          #   - proxy rotation
          #   - stealth mode
          #   - brotli decompression
          pip install cloudscraper-enhanced requests brotli

      - name: Run scraper
        env:
          # Comma-separated list, e.g.:
          #   http://user:pass@1.2.3.4:8080,http://5.6.7.8:3128
          # Leave empty (or unset the secret) to run on the runner's own IP.
          EVENT_PROXIES: ${{ secrets.EVENT_PROXIES }}
        run: python event.py

      - name: Show output file
        if: always()
        run: |
          ls -la EVENTdata.json || echo "EVENTdata.json not produced"
          head -c 500 EVENTdata.json 2>/dev/null || true

      - name: Upload JSON as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVENTdata
          path: EVENTdata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit & push updated EVENTdata.json
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EVENTdata.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to EVENTdata.json - nothing to commit."
          else
            git commit -m "chore: update EVENTdata.json [skip ci]"
            git push
          fi
