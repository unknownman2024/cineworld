name: Hoyts Australia Scraper

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Optional: run on every push to main (comment out if not wanted)
  # push:
  #   branches: [main]

# Needed so the job can push the updated JSON back to the repo
permissions:
  contents: write

jobs:
  scrape:
    name: Run Hoyts scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push back (GITHUB_TOKEN is fine with permissions above)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fake-useragent

      # If you later add a requirements.txt, replace the line above with:
      #   pip install -r requirements.txt

      - name: Run scraper
        run: |
          python "landmark-seatmap-test.py"
        # Rename "hoyts_scraper.py" to whatever your script file is called.
        # (GitHub doesn't accept "#!usrbinenv python3.txt" as a module name —
        #  save the file as hoyts_scraper.py in the repo root.)

      - name: Show output file
        run: |
          ls -la AUSdata.json || echo "AUSdata.json not produced"
          head -c 500 AUSdata.json || true

      - name: Upload JSON as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUSdata
          path: AUSdata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit & push updated AUSdata.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSdata.json || true
          if git diff --cached --quiet; then
            echo "No changes to AUSdata.json — nothing to commit."
          else
            git commit -m "chore: update AUSdata.json [skip ci]"
            git push
          fi
