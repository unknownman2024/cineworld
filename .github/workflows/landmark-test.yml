name: Hoyts Australia Scraper

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours
  workflow_dispatch:

permissions:
  contents: write              # needed to commit AUSdata.json back

concurrency:
  group: hoyts-scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Hoyts scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # brotli is a belt-and-suspenders fallback in case the API
          # ignores our Accept-Encoding and sends Content-Encoding: br
          pip install requests brotli

      - name: Run scraper
        env:
          # Optional: set this in repo Secrets -> HOYTS_PROXY
          HOYTS_PROXY: ${{ secrets.HOYTS_PROXY }}
        run: python landmark-seatmap-test.py

      - name: Show output file
        if: always()
        run: |
          ls -la AUSdata.json || echo "AUSdata.json not produced"
          head -c 500 AUSdata.json 2>/dev/null || true

      - name: Upload JSON as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AUSdata
          path: AUSdata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit & push updated AUSdata.json
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSdata.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to AUSdata.json - nothing to commit."
          else
            git commit -m "chore: update AUSdata.json [skip ci]"
            git push
          fi
